<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d3b35"><title>Payment Gateway</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><section class="hero"><div id="brand-tagline" class="eyebrow">Secure payment gateway</div><img id="brand-logo" class="brand-logo" alt="" hidden><h1 id="headline">Accept payments from any page.</h1><p id="description" class="lede">A simple hosted checkout powered by your payment gateway.</p></section><section class="card"><div class="card-head"><div><p class="kicker">Checkout</p><h2>Enter payment details</h2></div><div id="brand-name" class="brand-chip">Gateway</div></div><form id="payment-form"><div class="amount-row"><label class="field">Currency<select id="currency" name="currency"></select></label><label class="field amount-field">Amount<input name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></label></div><label class="field">Full name<input name="name" autocomplete="name" placeholder="Your name" required></label><label class="field">Email address<input name="email" autocomplete="email" type="email" placeholder="you@example.com" required></label><label id="description-field" class="field">Payment description <span class="optional">Optional</span><input name="description" placeholder="Order or service"></label><p id="form-error" class="form-error" hidden></p><button id="pay-button" class="pay-button" type="submit"><span class="button-label">Continue to payment</span><span>↗</span></button></form><p id="support-note" class="privacy-note">Payment details are completed on the secure payment checkout.</p></section><footer class="footer"><a href="/docs">API documentation</a><span>·</span><a href="/admin">Admin</a></footer></main><script src="/config.js" defer></script><script src="/app.js" defer></script></body></html>
