<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayLinks Checkout</title>
<style>body{font-family:Arial;background:#eaf2ff;margin:0;padding:16px}.card{background:#fff;border:2px solid #cfe2ff;border-radius:16px;padding:16px;max-width:420px;margin:0 auto}.pkg{display:flex;gap:10px}.pkg button{flex:1;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fff;cursor:pointer}.pkg button.active{border-color:#2563eb;background:#eef4ff}.qrbox{text-align:center;margin:14px 0}.qrbox img{width:260px;height:260px;object-fit:contain;border:1px solid #eee;border-radius:12px;background:#fff}.qrbox .ph{width:260px;height:260px;margin:0 auto;display:grid;place-items:center;border:2px dashed #cbd5e1;border-radius:12px;color:#64748b}.amt{text-align:center;font-size:32px;font-weight:800}.pay{display:flex;gap:8px}.pay button{flex:1;padding:10px;border-radius:999px;border:1px solid #ddd;cursor:pointer;background:#fff}.pay button.active{outline:2px solid #2563eb}input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}#done{width:100%;padding:14px;background:#2563eb;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:700;margin-top:10px}label{font-size:12px;color:#64748b}</style></head>
<body><div class="card">
<h2 style="text-align:center;margin:0" id="brand">PayLinks</h2><p style="text-align:center;font-size:12px">— SAFE • FAST • SECURE —</p>
<div class="pkg"><button id="pkg99" onclick="selectPkg('99')">BASIC<br><b id="p99price">₱99</b><br><small id="p99name">Basic Photo</small></button><button id="pkg149" class="active" onclick="selectPkg('149')">MAGIC ⭐ MOST POPULAR<br><b id="p149price">₱149</b><br><small id="p149name">Magic With Music</small></button></div>
<div class="qrbox"><div id="qrWrap"><div class="ph" id="qrPh">No QR uploaded yet for ₱149<br>Upload one in Admin CMS</div><img id="qrImg" style="display:none"></div><div id="qrLabel" style="font-size:13px;color:#475569">Scan to Pay</div></div>
<div class="amt" id="amountDisplay">₱149.00</div><p style="text-align:center" id="purposeDisplay">Magic With Music</p>
<div class="pay"><button class="active" onclick="selectPay(this,'GCash')">GCash</button><button onclick="selectPay(this,'Maya')">maya</button><button onclick="selectPay(this,'GoTyme')">GOtyme</button></div>
<label>Receiver</label><div id="receiver" style="font-weight:700">Juan Dela Cruz • 0917 123 4567</div>
<input id="name" placeholder="Your Name" value="Juan Dela Cruz"><input id="gcash" placeholder="Your GCash # / Sender #" value="0917 123 4567"><input id="ref" placeholder="Reference # - auto after Done" readonly>
<button id="done" onclick="createPayment()">Done - Pay ₱149</button><p id="msg" style="text-align:center;font-size:13px"></p>
<p style="text-align:center;font-size:12px">🔒 Your payment is secured with PayLinks</p></div>
<script>
let settings={},amount=149,purpose='Magic With Music',method='GCash',pkgKey='149';
async function load(){try{const r=await fetch('/api/config/public');const d=await r.json();settings=d.settings||{};}catch(e){}
 document.getElementById('brand').textContent=settings.brandName||'PayLinks';
 document.getElementById('p99name').textContent=settings.pkg99Name||'Basic Photo';
 document.getElementById('p99price').textContent='₱'+(settings.pkg99Price||99);
 document.getElementById('p149name').textContent=settings.pkg149Name||'Magic With Music';
 document.getElementById('p149price').textContent='₱'+(settings.pkg149Price||149);
 document.getElementById('receiver').textContent=(settings.gcashName||'Juan Dela Cruz')+' • '+(settings.gcashNumber||'0917 123 4567');
 document.getElementById('qrLabel').textContent=settings.qrLabel||'Scan to Pay';
 window._qrFor = k => k==='99' ? (settings.qr99Url||settings.qrUrl) : (settings.qr149Url||settings.qrUrl); const q=window._qrFor('149'); if(q){document.getElementById('qrImg').src=q;document.getElementById('qrImg').style.display='block';document.getElementById('qrPh').style.display='none';}
 selectPkg('149');}
function selectPkg(k){pkgKey=k;const is99=k==='99';amount=is99?(settings.pkg99Price||99):(settings.pkg149Price||149);purpose=is99?(settings.pkg99Name||'Basic Photo'):(settings.pkg149Name||'Magic With Music');
 document.getElementById('pkg99').classList.toggle('active',is99);document.getElementById('pkg149').classList.toggle('active',!is99);
 const qq=window._qrFor(k); if(qq){document.getElementById('qrImg').src=qq;document.getElementById('qrImg').style.display='block';document.getElementById('qrPh').style.display='none';} else {document.getElementById('qrImg').style.display='none';document.getElementById('qrPh').style.display='grid';document.getElementById('qrPh').innerHTML='No QR uploaded yet for ₱'+amount+'<br>Upload one in Admin CMS';} document.getElementById('amountDisplay').textContent='₱'+amount+'.00';document.getElementById('purposeDisplay').textContent=purpose;document.getElementById('done').textContent='Done - Pay ₱'+amount;}
function selectPay(b,m){method=m;document.querySelectorAll('.pay button').forEach(x=>x.classList.remove('active'));b.classList.add('active');}
async function createPayment(){const res=await fetch('/api/create-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount,currency:'PHP',name:document.getElementById('name').value,email:'test@test.com',purpose:purpose+' via '+method,gcash_number:document.getElementById('gcash').value,payment_method:method,package_name:purpose})});const data=await res.json();if(!data.ok){document.getElementById('msg').textContent=data.error;return;}const ref=data.payment.reference;document.getElementById('ref').value=ref;document.getElementById('msg').textContent='Created: '+ref+' - Pay now, then upload proof / wait for Admin approval.';}
load();</script></body></html>
