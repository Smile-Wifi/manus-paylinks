<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayLinks Admin CMS</title>
<style>body{font-family:Arial;background:#f1f5f9;margin:0;padding:16px}h1{font-size:22px}.wrap{max-width:900px;margin:0 auto}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0}input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{padding:11px 16px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button.ghost{background:#e2e8f0;color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}img.qr{width:180px;height:180px;object-fit:contain;border:1px solid #eee;border-radius:10px}.tabs{display:flex;gap:8px}.tabs button{background:#e2e8f0;color:#111}.tabs button.active{background:#2563eb;color:#fff}</style></head>
<body><script>window.PAYLINKS_API = (function(){var q=new URLSearchParams(location.search).get('api');if(q){try{localStorage.setItem('paylinks_api',q);}catch(e){}return q;}try{var s=localStorage.getItem('paylinks_api');if(s)return s;}catch(e){}if(location.hostname.endsWith('vercel.app')||location.hostname.endsWith('netlify.app'))return 'https://YOUR-RENDER.onrender.com';return '';})();function apiUrl(p){var a=window.PAYLINKS_API||'';if(!a)return p;if(p.charAt(0)==='/')return a+p;return a+'/'+p;}function qrUrl(u){if(!u)return '';if(/^https?:\/\//i.test(u))return u;return apiUrl(u);}</script><div class="wrap"><h1>PayLinks Admin CMS</h1><p>Admin Key: <input id="key" placeholder="Paste ADMIN_API_KEY" style="max-width:320px;display:inline-block"> <button onclick="loadAll()">Load CMS</button></p>
<div class="tabs"><button class="active" onclick="show('cms',this)">1. Customize Checkout</button><button onclick="show('qr',this)">2. QR Upload</button><button onclick="show('pay',this)">3. Payments / Approve</button></div>
<div id="cms" class="card"><h2>Branding + Packages + Receiver</h2><div class="grid">
<div><label>Brand Name</label><input id="brandName"><label>Tagline</label><input id="brandTagline"><label>Primary Color</label><input id="primaryColor" type="color"></div>
<div><label>GCash Receiver Name</label><input id="gcashName"><label>GCash Receiver Number</label><input id="gcashNumber"><label>QR Label</label><input id="qrLabel"></div></div>
<h3>Packages</h3><div class="grid"><div><label>â‚±99 Package Name</label><input id="pkg99Name"><label>â‚±99 Price</label><input id="pkg99Price" type="number"><label><input type="checkbox" id="pkg99Enabled" style="width:auto"> Enable â‚±99</label></div>
<div><label>â‚±149 Package Name</label><input id="pkg149Name"><label>â‚±149 Price</label><input id="pkg149Price" type="number"><label><input type="checkbox" id="pkg149Enabled" style="width:auto"> Enable â‚±149</label></div></div>
<button onclick="save()">ðŸ’¾ Save All Customization</button> <span id="saveMsg"></span><br><br><a href="/checkout.html" target="_blank">Open Checkout â†’</a></div>
<div id="qr" class="card" style="display:none"><h2>QR Code Upload - Different QR per Package</h2>
<div class="grid"><div><h3>â‚±99 QR</h3><img id="qrPreview99" class="qr" style="display:none"><br><input type="file" id="qrFile99" accept="image/*"><button onclick="uploadQR('99')">Upload â‚±99 QR</button><span id="qrMsg99"></span><p>URL: <span id="qrUrl99"></span></p></div>
<div><h3>â‚±149 QR</h3><img id="qrPreview149" class="qr" style="display:none"><br><input type="file" id="qrFile149" accept="image/*"><button onclick="uploadQR('149')">Upload â‚±149 QR</button><span id="qrMsg149"></span><p>URL: <span id="qrUrl149"></span></p></div></div>
<p>If a package has no QR, checkout falls back to the old single QR.</p></div>
<div id="pay" class="card" style="display:none"><h2>Payments</h2><input id="q" placeholder="Search name / reference"><button onclick="loadPayments()">Search</button><div id="list"></div></div>
</div>
<script>
function show(id,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['cms','qr','pay'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');}
function auth(){return {'Content-Type':'application/json','Authorization':'Bearer '+document.getElementById('key').value};}
async function loadAll(){const r=await fetch(apiUrl('/api/admin/settings',{headers:auth()});const d=await r.json();if(!d.ok){alert(d.error);return;}const s=d.settings;for(const k of ['brandName','brandTagline','primaryColor','gcashName','gcashNumber','qrLabel','pkg99Name','pkg99Price','pkg149Name','pkg149Price']){if(document.getElementById(k))document.getElementById(k).value=s[k]??'';}document.getElementById('pkg99Enabled').checked=s.pkg99Enabled!==false;document.getElementById('pkg149Enabled').checked=s.pkg149Enabled!==false;if(s.qr99Url){document.getElementById('qrPreview99').src=qrUrl(s.qr99Url);document.getElementById('qrPreview99').style.display='block';document.getElementById('qrUrl99').textContent=s.qr99Url;} if(s.qr149Url){document.getElementById('qrPreview149').src=qrUrl(s.qr149Url);document.getElementById('qrPreview149').style.display='block';document.getElementById('qrUrl149').textContent=s.qr149Url;}loadPayments();}
async function save(){const v=id=>document.getElementById(id).value;const body={brandName:v('brandName'),brandTagline:v('brandTagline'),primaryColor:v('primaryColor'),gcashName:v('gcashName'),gcashNumber:v('gcashNumber'),qrLabel:v('qrLabel'),pkg99Name:v('pkg99Name'),pkg99Price:Number(v('pkg99Price')),pkg149Name:v('pkg149Name'),pkg149Price:Number(v('pkg149Price')),pkg99Enabled:document.getElementById('pkg99Enabled').checked,pkg149Enabled:document.getElementById('pkg149Enabled').checked};const r=await fetch(apiUrl('/api/admin/settings',{method:'PUT',headers:auth(),body:JSON.stringify(body)});const d=await r.json();document.getElementById('saveMsg').textContent=d.ok?'âœ… Saved - checkout updated!':d.error;}
async function uploadQR(slot){const f=document.getElementById('qrFile'+slot).files[0];if(!f){alert('Pick a QR image first');return;}const rd=new FileReader();rd.onload=async()=>{const r=await fetch(apiUrl('/api/admin/qr',{method:'POST',headers:auth(),body:JSON.stringify({qr_image:rd.result,slot})});const d=await r.json();document.getElementById('qrMsg'+slot).textContent=d.ok?'âœ… QR uploaded for â‚±'+slot+'!':'âŒ '+d.error;if(d.ok){document.getElementById('qrPreview'+slot).src=qrUrl(d.qrUrl);document.getElementById('qrPreview'+slot).style.display='block';}};rd.readAsDataURL(f);}
async function loadPayments(){const q=document.getElementById('q').value;const r=await fetch(apiUrl('/api/admin/payments?q='+encodeURIComponent(q),{headers:auth()});const d=await r.json();if(!d.ok){document.getElementById('list').textContent=d.error;return;}document.getElementById('list').innerHTML='<table><tr><th>Ref</th><th>Name</th><th>Amount</th><th>Method</th><th>GCash #</th><th>Status</th><th>Action</th></tr>'+d.payments.map(p=>`<tr><td>${p.reference}</td><td>${p.name}</td><td>â‚±${p.amount}</td><td>${p.payment_method||''}</td><td>${p.gcash_number||''}</td><td>${p.status}</td><td>${p.status.startsWith('pending')?`<button onclick="decide('${p.reference}','approve')">Approve</button> <button class="ghost" onclick="decide('${p.reference}','reject')">Reject</button>`:''} ${p.proof_url?`<a href="${p.proof_url}" target="_blank">Proof</a>`:''}</td></tr>`).join('')+'</table>';}
async function decide(ref,act){const r=await fetch(apiUrl(`/api/admin/payments/${ref}/${act}`),{method:'POST',headers:auth(),body:JSON.stringify({})});const d=await r.json();alert(d.ok?'Done: '+d.payment.status:d.error);loadPayments();}
</script></body></html>
