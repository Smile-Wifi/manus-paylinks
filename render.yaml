services:
    - type: web
    name: manus-paylinks
    env: node
    plan: starter
    branch: main
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: paylinks-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
            - key: NODE_ENV
        value: production
            - key: CORS_ORIGIN
        value: "*"
            - key: ADMIN_API_KEY
        generateValue: true
            - key: GATEWAY_API_KEY
        generateValue: true
            - key: GATEWAY_WEBHOOK_SECRET
        generateValue: true
